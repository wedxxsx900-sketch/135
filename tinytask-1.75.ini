-----------------------------------------
-- Rainbow RGB Effect System
-----------------------------------------
local menuOpen = true
local rainbowSpeed = 0.1 -- ความเร็วไฟสีรุ้ง (ปรับเพิ่ม/ลดได้ตามใจชอบ)

runService.RenderStepped:Connect(function()
	local hue = (tick() * rainbowSpeed) % 1
	local rainbowColor = Color3.fromHSV(hue, 1, 1)
	
	-- ไฟปุ่มเปิด/ปิด จะวิ่งสีรุ้งตลอดเวลาไม่ว่าจะเปิดหรือปิดหน้าต่าง
	toggleStroke.Color = rainbowColor
	
	-- ไฟหน้าต่างหลักและรูปภาพจะวิ่งเฉพาะตอนเมนูเปิดอยู่
	if menuOpen then
		windowStroke.Color = rainbowColor
		imageStroke.Color = rainbowColor
	end
end)

-----------------------------------------
-- Advanced Dragging Interface System
-----------------------------------------
local function makeDraggable(dragPart, targetPart)
	local dragging, dragInput, dragStart, startPos
	
	dragPart.InputBegan:Connect(function(input)
		if input.UserInputType == Enum.UserInputType.MouseButton1 or input.UserInputType == Enum.UserInputType.Touch then
			dragging = true
			dragStart = input.Position
			startPos = targetPart.Position
			
			input.Changed:Connect(function()
				if input.UserInputState == Enum.UserInputState.End then
					dragging = false
				end
			end)
		end
	end)
	
	dragPart.InputChanged:Connect(function(input)
		if input.UserInputType == Enum.UserInputType.MouseMovement or input.UserInputType == Enum.UserInputType.Touch then
			dragInput = input
		end
	end)
	
	userInputService.InputChanged:Connect(function(input)
		if input == dragInput and dragging then
			local delta = input.Position - dragStart
			targetPart.Position = UDim2.new(startPos.X.Scale, startPos.X.Offset + delta.X, startPos.Y.Scale, startPos.Y.Offset + delta.Y)
		end
	end)
end

makeDraggable(titleBar, mainWindow)
makeDraggable(toggleButton, toggleButton)

