-----------------------------------------
-- Core Mechanism (Lucky Block Spawn Loop)
-----------------------------------------
local isPressing = false

local function fireSpawnEvent()
	local spawnEvent = replicatedStorage:FindFirstChild("SpawnLuckyBlock")
	if spawnEvent and spawnEvent:IsA("RemoteEvent") then
		spawnEvent:FireServer()
	end
end

yujiButton.MouseButton1Down:Connect(function()
	isPressing = true
	tweenService:Create(yujiButton, tweenInfoFast, {Size = UDim2.new(0, 140, 0, 140), Position = UDim2.new(0.5, -70, 0, 60)}):Play()
	
	task.spawn(function()
		while isPressing do
			fireSpawnEvent()
			task.wait(0.05) 
		end
	end)
end)

local function stopSpawning()
	if isPressing then
		isPressing = false
		tweenService:Create(yujiButton, tweenInfoFast, {Size = UDim2.new(0, 150, 0, 150), Position = UDim2.new(0.5, -75, 0, 55)}):Play()
	end
end

yujiButton.MouseButton1Up:Connect(stopSpawning)
yujiButton.MouseLeave:Connect(stopSpawning)

-----------------------------------------
-- Anti-Bounce Toggle Logic Interface
-----------------------------------------
local toggleDebounce = false
local originalSize = UDim2.new(0, 220, 0, 280)

local closeConnection = nil
local openConnection = nil

toggleButton.MouseButton1Click:Connect(function()
	if toggleDebounce then return end
	toggleDebounce = true
	
	if closeConnection then closeConnection:Disconnect() closeConnection = nil end
	if openConnection then openConnection:Disconnect() openConnection = nil end
	
	if menuOpen then
		menuOpen = false
		isPressing = false
		windowStroke.Enabled = false
		
		local closeTween = tweenService:Create(mainWindow, tweenInfoSmooth, {
			Size = UDim2.new(0, 0, 0, 0)
		})
		closeTween:Play()
		
		closeConnection = closeTween.Completed:Connect(function()
			if not menuOpen then
				mainWindow.Visible = false
			end
			toggleDebounce = false
		end)
		
		toggleButton.Text = "OPEN"
		tweenService:Create(toggleButton, tweenInfoFast, {BackgroundColor3 = Color3.fromRGB(46, 204, 113)}):Play()
	else
		menuOpen = true
		mainWindow.Visible = true
		
		local openTween = tweenService:Create(mainWindow, tweenInfoSmooth, {
			Size = originalSize
		})
		openTween:Play()
		
		openConnection = openTween.Completed:Connect(function()
			if menuOpen then
				windowStroke.Enabled = true
			end
			toggleDebounce = false
		end)
		
		toggleButton.Text = "CLOSE"
		tweenService:Create(toggleButton, tweenInfoFast, {BackgroundColor3 = Color3.fromRGB(255, 35, 35)}):Play()
	end
end)

